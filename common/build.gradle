architectury {
    common("forge", "fabric")
}

loom {
    accessWidenerPath = file("src/main/resources/reterraforged.accesswidener")
}

dependencies {
    // Fabric loader provides the @Environment annotations and the Mixin library for common code.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    compileOnly "com.github.glitchfiend:TerraBlender-forge:${rootProject.minecraft_version}-${rootProject.terrablender_version}"
    compileOnly "com.electronwill.night-config:toml:3.6.7"
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-core:5.14.2"
}

test {
    useJUnitPlatform()
    systemProperty "rtf.updateGolden", System.getProperty("rtf.updateGolden", "false")
    maxHeapSize = "2G"
    testLogging.showStandardStreams = Boolean.getBoolean("rtf.showOutput")
    systemProperty "rtf.showOutput", System.getProperty("rtf.showOutput", "false")
    systemProperty "rtf.render", System.getProperty("rtf.render", "false")
    // hand-run surveys and measurements
    System.properties.findAll { it.key.startsWith("rtf.survey") }.each { systemProperty it.key, it.value }
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}
