org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod
mod_id=ultraterraforged
mod_version=1.0.0
archives_base_name=ultraterraforged
maven_group=com.pandaismyname1.ultraterraforged

# Minecraft
minecraft_version=1.20.1
java_version=17

# Loaders
fabric_loader_version=0.19.5
fabric_api_version=0.92.12+1.20.1
# the oldest Fabric API the mod needs, for fabric.mod.json; the build compiles against the version above
fabric_api_min=0.83.0+1.20.1
forge_version=47.4.23
# Lowest Forge-compatible loader accepted in mods.toml. NeoForge 1.20.1 (47.1.x) still reports as "forge".
forge_min_version=47.1

# Optional compat
terrablender_version=3.0.1.2
