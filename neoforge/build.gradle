plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        // new worlds in the dev game start in creative with cheats, to fly around and inspect terrain
        client {
            property "ultraterraforged.dev.creative", "true"
        }
        // ./gradlew :neoforge:runData regenerates the translation files into neoforge/src/generated; copy them into
        // common resources. The dev datagen JVM does not exit on its own once it prints "All providers took", so stop
        // it manually.
        data {
            data()
            programArgs "--mod", "ultraterraforged", "--all", "--output", file("src/generated/resources").absolutePath
        }
    }
}

repositories {
    maven { url = "https://maven.neoforged.net/releases/" }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // performance mods for the dev game, as released: since 26.1 the dev game and a real one use the same names, so
    // they go into its mods folder unchanged, nested jars and all
    devMods {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    // Performance mods, in the dev runs only: the ones PerformanceMods lists for NeoForge on this version, pinned to
    // Modrinth version ids. -Putf.perfMods=false leaves them out. See docs/porting/performance-mods.md.
    if (project.findProperty("utf.perfMods") != "false") {
        devMods "maven.modrinth:c2me-neoforge:Gj7cXd5I"         // C2ME 0.4.2-alpha.0.96
        devMods "maven.modrinth:c2me-ocl:V5SBeTwQ"              // C2ME OpenCL 0.4.2-alpha.0.96 (Java 25, which 26.x runs on)
        devMods "maven.modrinth:lithium:J9CowDXK"               // Lithium 0.25.3
        devMods "maven.modrinth:sodium:DmnNKsfS"                // Sodium 0.9.2
    }
}

// The dev game's mods folder holds exactly the performance mods: a jar left from another version would break the game.
// Not a Sync: with -Putf.perfMods=false there's nothing to copy, and Gradle skips a Sync without sources instead of
// emptying the folder.
def devModsDir = file("run/mods")
def syncDevMods = tasks.register("syncDevMods") {
    def jars = configurations.devMods
    inputs.files jars
    outputs.dir devModsDir
    doLast {
        project.delete(fileTree(devModsDir) { include "*.jar" })
        project.copy {
            from jars
            into devModsDir
        }
    }
}
tasks.matching { it.name.startsWith("run") }.configureEach {
    dependsOn syncDevMods
}

// NeoForge reads access transformers, not the widener, and Loom can't convert one to the other without remapping, so
// src/main/resources/META-INF/accesstransformer.cfg is kept by hand (docs/porting/tools/aw2at.py writes it). This checks
// it still matches the widener.
def checkAccessTransformer = tasks.register("checkAccessTransformer") {
    def widener = project(":common").file("src/main/resources/ultraterraforged.accesswidener")
    def transformer = file("src/main/resources/META-INF/accesstransformer.cfg")
    inputs.files widener, transformer
    doLast {
        def expected = accessTransformerFor(widener.readLines())
        def actual = transformer.readLines().findAll { !it.isBlank() && !it.startsWith("#") }
        if (expected != actual) {
            throw new GradleException("META-INF/accesstransformer.cfg doesn't match the access widener; run: python docs/porting/tools/aw2at.py")
        }
    }
}
tasks.named("processResources") { dependsOn checkAccessTransformer }

// the access transformer lines for access widener lines, as aw2at.py writes them
static List<String> accessTransformerFor(List<String> widener) {
    def out = []
    widener.each { line ->
        def parts = line.replaceAll(/#.*/, "").trim().split(/\s+/)
        if (parts.length < 3 || parts[0] == "accessWidener") return
        def (access, kind) = [parts[0], parts[1]]
        def owner = parts[2].replace("/", ".")
        // accessible: public; extendable and mutable: public and not final
        def modifier = access == "accessible" ? "public" : "public-f"
        switch (kind) {
            case "class": out << "${modifier} ${owner}".toString(); break
            case "method": out << "${modifier} ${owner} ${parts[3]}${parts[4]}".toString(); break
            case "field": out << "${modifier} ${owner} ${parts[3]}".toString(); break
        }
    }
    return out
}

processResources {
    def props = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        neoforge_version: rootProject.neoforge_version
    ]
    inputs.properties props

    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

// the released jar: nothing to remap since 26.1
shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge"
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// Maven: <group>:ultraterraforged-neoforge:<version>, published to the repository given by -PmavenUrl (CI publishes to a folder
// and pushes it to the "maven" branch)
publishing {
    publications {
        register("maven", MavenPublication) {
            artifactId = "${rootProject.archives_base_name}-${project.name}"
            version = project.ext.mavenVersion
            artifact(shadowJar) {
                builtBy shadowJar
                classifier ""
            }
            artifact(sourcesJar) {
                builtBy sourcesJar
                classifier "sources"
            }
        }
    }
    repositories {
        if (project.hasProperty("mavenUrl")) {
            maven {
                url = project.mavenUrl
                if (!project.mavenUrl.toString().startsWith("file:")) {
                    credentials {
                        username = project.findProperty("mavenUsername") ?: "ci"
                        password = project.findProperty("mavenPassword") ?: "ci"
                    }
                }
            }
        }
    }
}
