plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        // new worlds in the dev game start in creative with cheats, to fly around and inspect terrain
        client {
            property "ultraterraforged.dev.creative", "true"
        }
        // ./gradlew :neoforge:runData regenerates the translation files into neoforge/src/generated; copy them into
        // common resources. The dev datagen JVM does not exit on its own once it prints "All providers took", so stop
        // it manually.
        data {
            data()
            programArgs "--mod", "ultraterraforged", "--all", "--output", file("src/generated/resources").absolutePath
        }
    }
}

repositories {
    maven { url = "https://maven.neoforged.net/releases/" }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // performance mods for the dev game, as released: NeoForge has run on Mojang's names since 1.20.2, as the dev game
    // does, so they go into its mods folder unchanged, nested jars and all
    devMods {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    // Performance mods, in the dev runs only: the ones PerformanceMods lists for NeoForge on this version, pinned to
    // Modrinth version ids and a CurseForge file. -Putf.perfMods=false leaves them out. See
    // docs/porting/performance-mods.md.
    if (project.findProperty("utf.perfMods") != "false") {
        // not C2ME OpenCL: it needs Java 25, the dev game runs on 21
        devMods "maven.modrinth:c2me-neoforge:yxOYFgnK"         // C2ME 0.4.0-alpha.0.122
        devMods "maven.modrinth:noisiumed:U3gpLtpO"             // Noisiumed 3.0.6
        devMods "maven.modrinth:lithium:DDUrRVCA"               // Lithium 0.15.4
        devMods "maven.modrinth:modernfix:5HLHxQ2F"             // ModernFix 5.27.24
        devMods "maven.modrinth:sodium:uMOpc5uV"                // Sodium 0.8.13
        devMods "curse.maven:alltheleaks-1091339:8943912"       // AllTheLeaks 1.1.13
    }
}

// the dev game's mods folder holds exactly the performance mods: a jar left from another version would break the game
def devModsDir = file("run/mods")
def syncDevMods = tasks.register("syncDevMods", Sync) {
    from configurations.devMods
    into devModsDir
}
tasks.matching { it.name.startsWith("run") }.configureEach {
    dependsOn syncDevMods
}

processResources {
    def props = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        neoforge_version: rootProject.neoforge_version
    ]
    inputs.properties props

    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = "neoforge"
    // NeoForge reads access transformers, not the widener
    atAccessWideners.add loom.accessWidenerPath.get().asFile.name
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// Maven: <group>:ultraterraforged-neoforge:<version>, published to the repository given by -PmavenUrl (CI publishes to a folder
// and pushes it to the "maven" branch)
publishing {
    publications {
        register("maven", MavenPublication) {
            artifactId = "${rootProject.archives_base_name}-${project.name}"
            version = project.ext.mavenVersion
            artifact(remapJar) {
                builtBy remapJar
                classifier ""
            }
            artifact(sourcesJar) {
                builtBy sourcesJar
                classifier "sources"
            }
        }
    }
    repositories {
        if (project.hasProperty("mavenUrl")) {
            maven {
                url = project.mavenUrl
                if (!project.mavenUrl.toString().startsWith("file:")) {
                    credentials {
                        username = project.findProperty("mavenUsername") ?: "ci"
                        password = project.findProperty("mavenPassword") ?: "ci"
                    }
                }
            }
        }
    }
}
