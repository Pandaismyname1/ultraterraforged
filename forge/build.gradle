plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        // new worlds in the dev game start in creative with cheats, to fly around and inspect terrain
        client {
            property "reterraforged.dev.creative", "true"
        }
    }

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "reterraforged-common.mixins.json"
        mixinConfig "reterraforged-forge.mixins.json"

        // ./gradlew :forge:runData regenerates the translation files into forge/src/generated; copy them into common resources.
        // The dev datagen JVM does not exit on its own once it prints "All providers took", so stop it manually.
        dataGen {
            mod "reterraforged"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

processResources {
    def props = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        forge_min_version: rootProject.forge_min_version
    ]
    inputs.properties props

    filesMatching("META-INF/mods.toml") {
        expand props
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = "forge"
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
