plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        // new worlds in the dev game start in creative with cheats, to fly around and inspect terrain
        client {
            property "reterraforged.dev.creative", "true"
        }
    }

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "reterraforged-common.mixins.json"
        mixinConfig "reterraforged-forge.mixins.json"

        // ./gradlew :forge:runData regenerates the translation files into forge/src/generated; copy them into common resources.
        // The dev datagen JVM does not exit on its own once it prints "All providers took", so stop it manually.
        dataGen {
            mod "reterraforged"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // Fabric mods for Sinytra Connector, which only looks for them in the mods folder
    connectorMods {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }

    // the dev runs' mods as released, to take out the libraries they nest (see extractNestedDevLibs)
    devModJars {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    // Performance mods, in the dev runs only: the ones PerformanceMods lists for Forge on this version, pinned to
    // Modrinth version ids and a CurseForge file. -Prtf.perfMods=false leaves them out. See
    // docs/porting/performance-mods.md.
    if (project.findProperty("rtf.perfMods") != "false") {
        [
            "maven.modrinth:noisiumed:LbWCNzST",        // Noisiumed 3.0.6
            "maven.modrinth:radium:n947JjJH",           // Radium 0.12.4, standing in for Lithium
            "maven.modrinth:modernfix:jAZ7Ge3d",        // ModernFix 5.27.83
            "maven.modrinth:embeddium:UTbfe5d1",        // Embeddium 0.3.31, standing in for Sodium
            "curse.maven:alltheleaks-1091339:8779054"   // AllTheLeaks 1.1.3
        ].each {
            modLocalRuntime it
            devModJars it
        }
        // The libraries these nest load in a real game, but remapping the mods for the dev game drops the list of them
        // (META-INF/jarjar/metadata.json), so they're taken out and added here. MixinExtras, which several nest in
        // different versions, comes once, the newest of them.
        localRuntime fileTree(layout.buildDirectory.dir("devlibs-nested")) {
            include "*.jar"
            builtBy "extractNestedDevLibs"
        }
        localRuntime "io.github.llamalad7:mixinextras-forge:0.5.0"

        // C2ME has no Forge build: Sinytra Connector runs the Fabric one, with Forgified Fabric API. Connector keeps its
        // own mod inside its jar, named for a real game, and only loads it from there, so Loom can't remap it: see
        // prepareConnectorForDev
        localRuntime files(layout.buildDirectory.file("connector-dev/Connector-dev.jar")) {
            builtBy "prepareConnectorForDev"
        }
        modLocalRuntime("dev.su5ed.sinytra.fabric-api:fabric-api:0.92.6+1.11.15+1.20.1") {
            // an old Fabric loader for Forge; Connector brings its own, and both at once fail to start
            exclude group: "dev.su5ed.sinytra", module: "fabric-loader"
        }
        connectorMods "maven.modrinth:c2me-fabric:fyt7FtgA"     // C2ME 0.2.0+alpha.11.18
    }
}

// Sinytra Connector for the dev game: its code and the mod it keeps inside itself remapped from a real game's names
// (srg) to the dev game's (named), with Loom's own mappings and remapper, and the remapped mod put back in its place
tasks.register("prepareConnectorForDev") {
    def url = "https://maven.su5ed.dev/releases/org/sinytra/Connector/1.0.0-beta.49%2B1.20.1/Connector-1.0.0-beta.49%2B1.20.1.jar"
    def dir = layout.buildDirectory.dir("connector-dev")
    outputs.file(dir.map { it.file("Connector-dev.jar") })
    inputs.property("url", url)
    doLast {
        def work = dir.get().asFile
        work.mkdirs()
        def original = new File(work, "Connector.jar")
        if (!original.exists()) {
            new URL(url).withInputStream { input -> original.bytes = input.bytes }
        }
        def loom = net.fabricmc.loom.LoomGradleExtension.get(project)
        def mappings = loom.mappingConfiguration.tinyMappingsWithSrg
        def game = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${rootProject.minecraft_version}/forge/${rootProject.minecraft_version}-${rootProject.forge_version}/minecraft-merged-srg-patched.jar")
        def remap = { File input, File output ->
            def remapper = net.fabricmc.tinyremapper.TinyRemapper.newRemapper()
                .withMappings(net.fabricmc.tinyremapper.TinyUtils.createTinyMappingProvider(mappings, "srg", "named"))
                .build()
            output.delete()
            def out = new net.fabricmc.tinyremapper.OutputConsumerPath.Builder(output.toPath()).build()
            try {
                out.addNonClassFiles(input.toPath(), net.fabricmc.tinyremapper.NonClassCopyMode.UNCHANGED, remapper)
                remapper.readInputs(input.toPath())
                remapper.readClassPath(game.toPath())
                remapper.apply(out)
            } finally {
                out.close()
                remapper.finish()
            }
        }
        def zip = new java.util.zip.ZipFile(original)
        def embedded = new java.util.jar.Manifest(zip.getInputStream(zip.getEntry("META-INF/MANIFEST.MF"))).mainAttributes.getValue("Embedded-Dependencies-Mod")
        def mod = new File(work, "mod.jar")
        mod.bytes = zip.getInputStream(zip.getEntry(embedded)).bytes
        zip.close()
        def modNamed = new File(work, "mod-named.jar")
        def outerNamed = new File(work, "outer-named.jar")
        remap(mod, modNamed)
        remap(original, outerNamed)
        // the remapped outer jar, with the remapped mod in place of the original
        def result = new File(work, "Connector-dev.jar")
        def outer = new java.util.zip.ZipFile(outerNamed)
        new java.util.zip.ZipOutputStream(new FileOutputStream(result)).withCloseable { out ->
            outer.entries().each { entry ->
                out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                if (!entry.directory) {
                    out.write(entry.name == embedded ? modNamed.bytes : outer.getInputStream(entry).bytes)
                }
                out.closeEntry()
            }
        }
        outer.close()
    }
}

// copies the Fabric mods into the dev game's mods folder; they're named by version, so a newer one sits beside an
// older one until that's deleted
tasks.register("copyConnectorMods", Copy) {
    from configurations.connectorMods
    into file("run/mods")
}

tasks.register("extractNestedDevLibs", Sync) {
    from(configurations.devModJars.elements.map { jars -> jars.collect { zipTree(it.asFile) } }) {
        include "META-INF/jarjar/*.jar", "META-INF/jars/*.jar"
        exclude "**/mixinextras-*"
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir("devlibs-nested")
    // a real game loads nested libraries as game libraries; the dev game only takes a jar from the classpath as one
    // when its manifest says so
    doLast {
        destinationDir.listFiles().findAll { it.name.endsWith(".jar") }.each { File jar ->
            def zip = new java.util.zip.ZipFile(jar)
            def manifest = zip.getEntry("META-INF/MANIFEST.MF")
            def text = manifest != null ? zip.getInputStream(manifest).getText("UTF-8") : "Manifest-Version: 1.0\r\n"
            if (text.contains("FMLModType") || zip.getEntry("META-INF/mods.toml") != null) {
                zip.close()
                return
            }
            def marked = new File(jar.parentFile, jar.name + ".tmp")
            new java.util.zip.ZipOutputStream(new FileOutputStream(marked)).withCloseable { out ->
                out.putNextEntry(new java.util.zip.ZipEntry("META-INF/MANIFEST.MF"))
                out.write((text.trim() + "\r\nFMLModType: GAMELIBRARY\r\n\r\n").getBytes("UTF-8"))
                out.closeEntry()
                zip.entries().each { entry ->
                    if (entry.name != "META-INF/MANIFEST.MF") {
                        out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                        if (!entry.directory) {
                            out.write(zip.getInputStream(entry).bytes)
                        }
                        out.closeEntry()
                    }
                }
            }
            zip.close()
            jar.delete()
            marked.renameTo(jar)
        }
    }
}
tasks.matching { it.name.startsWith("run") || it.name in ["configureLaunch", "configureClientLaunch", "generateDLIConfig"] }.configureEach {
    dependsOn "extractNestedDevLibs", "copyConnectorMods", "prepareConnectorForDev"
}

// Sinytra Connector finds the unpatched game on its own in a real game, but in dev it needs one named the way the dev
// game is: the Fabric side's copy, built with the same mappings. Only known once Loom has set the mappings up.
tasks.withType(JavaExec).matching { it.name.startsWith("run") }.configureEach {
    doFirst {
        // the same mappings as this project, less the Forge part of the name
        def mappings = net.fabricmc.loom.LoomGradleExtension.get(project).mappingConfiguration.mappingsIdentifier.replaceAll(/-forge-.*$/, "")
        def version = "${rootProject.minecraft_version}-${mappings}"
        def clean = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged/${version}/minecraft-merged-${version}.jar")
        if (clean.exists()) {
            systemProperty "connector.clean.path", clean.absolutePath
        } else {
            logger.warn("No unpatched Minecraft at {} for Sinytra Connector; run a Fabric task first", clean)
        }
    }
}

processResources {
    def props = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        forge_min_version: rootProject.forge_min_version
    ]
    inputs.properties props

    filesMatching("META-INF/mods.toml") {
        expand props
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = "forge"
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
