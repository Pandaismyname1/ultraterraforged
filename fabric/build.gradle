plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // mods the dev runs load like a mods folder would: for mods made of nested jars, which the classpath doesn't unpack
    devModsFolder {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") { exclude group: "net.fabricmc", module: "fabric-loader" }

    common(project(path: ":common")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }

    // Performance mods, in the dev runs only: the ones PerformanceMods lists for Fabric on this version, pinned to
    // Modrinth version ids (the version numbers are shared between loaders). -Putf.perfMods=false leaves them out, to
    // measure or debug UltraTerraForged on its own. See docs/porting/performance-mods.md.
    if (project.findProperty("utf.perfMods") != "false") {
        // C2ME 0.4.2-alpha.0.88: its modules are nested jars. No C2ME OpenCL or Voxy for 26.3 yet.
        devModsFolder "maven.modrinth:c2me-fabric:sSoXjAqP"
        localRuntime "maven.modrinth:lithium:xS0Q8LSi"          // Lithium 0.26.2
        localRuntime "maven.modrinth:sodium:v4PSXean"           // Sodium 0.9.3-alpha.1
    }
}

processResources {
    def props = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        fabric_loader_version: rootProject.fabric_loader_version,
        fabric_api_version: rootProject.fabric_api_version
    ]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

// the released jar: nothing to remap since 26.1
shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "fabric"
}


jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// A client run that drives world creation and takes screenshots: ./gradlew :fabric:runClientTest
// Output (screenshots, log of what happened) goes to fabric/build/clienttest.
sourceSets {
    clienttest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

def devModsDir = layout.buildDirectory.dir("devmods")
def syncDevMods = tasks.register("syncDevMods", Sync) {
    from configurations.devModsFolder
    into devModsDir
}
tasks.matching { it.name.startsWith("run") }.configureEach {
    dependsOn syncDevMods
}

loom {
    runs {
        configureEach {
            property "fabric.addMods", devModsDir.get().asFile.absolutePath
        }
        // new worlds in the dev game start in creative with cheats, to fly around and inspect terrain
        client {
            property "ultraterraforged.dev.creative", "true"
        }
        clientTest {
            client()
            name = "Client Test"
            source sourceSets.clienttest
            runDir = "run-clienttest"
            property "ultraterraforged.clienttest.out", file("build/clienttest").absolutePath
            // -Dultraterraforged.clienttest.tour=true visits the landforms in a default world instead
            property "ultraterraforged.clienttest.tour", System.getProperty("ultraterraforged.clienttest.tour", "false")
            property "ultraterraforged.clienttest.stops", System.getProperty("ultraterraforged.clienttest.stops", "river,salt_flat,alluvial_fan,glacial_valley,cirque,drumlins,moraine,barrier_island,karst,sinkhole,delta,wetland,lake,peninsula,coastal_island,sand_bar,skerry,volcanic_island,river_island,submarine_canyon,seamount,guyot,blue_hole,coral_reef,ocean_trench,ocean_ridge,sand_waves")
            property "ultraterraforged.dev.creative", "true"
        }
    }
}

// Maven: <group>:ultraterraforged-fabric:<version>, published to the repository given by -PmavenUrl (CI publishes to a folder
// and pushes it to the "maven" branch)
publishing {
    publications {
        register("maven", MavenPublication) {
            artifactId = "${rootProject.archives_base_name}-${project.name}"
            version = project.ext.mavenVersion
            artifact(shadowJar) {
                builtBy shadowJar
                classifier ""
            }
            artifact(sourcesJar) {
                builtBy sourcesJar
                classifier "sources"
            }
        }
    }
    repositories {
        if (project.hasProperty("mavenUrl")) {
            maven {
                url = project.mavenUrl
                if (!project.mavenUrl.toString().startsWith("file:")) {
                    credentials {
                        username = project.findProperty("mavenUsername") ?: "ci"
                        password = project.findProperty("mavenPassword") ?: "ci"
                    }
                }
            }
        }
    }
}
