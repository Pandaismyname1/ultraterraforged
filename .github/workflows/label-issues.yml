name: Label issues
on:
  issues:
    types: [ opened ]

# the issue forms ask for the Minecraft version and the loader; this turns the answers into labels
permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            // an issue form's answer is the paragraph under its "### Label" heading
            const answer = (heading) => {
              const match = body.match(new RegExp('^### ' + heading + '[^\\n]*\\n+([^\\n]+)', 'm'));
              return match ? match[1].trim() : null;
            };
            const versions = { '1.20.1': 'mc: 1.20.1', '1.21.1': 'mc: 1.21.1', '26.1': 'mc: 26.1', '26.2': 'mc: 26.2', '26.3': 'mc: 26.3' };
            const loaders = { 'Fabric': 'loader: fabric', 'NeoForge': 'loader: neoforge', 'Forge': 'loader: forge' };
            const labels = [versions[answer('Minecraft version')], loaders[answer('Mod loader')]].filter(Boolean);
            if (labels.length > 0) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.payload.issue.number, labels });
            }
