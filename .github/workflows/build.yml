name: Build
on: [ pull_request, push ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # Gradle and Loom run on Java 21; the mod itself targets Java 17
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/loom-cache
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      # the performance mods are only for the dev games; leaving them out keeps CI off their Maven servers
      - name: Build Fabric
        run: ./gradlew :fabric:build -Prtf.perfMods=false

      # the Forge jar also runs on NeoForge 47.1
      - name: Build Forge
        run: ./gradlew :forge:build -Prtf.perfMods=false

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            forge/build/libs/

  test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/loom-cache
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      # includes the checks that the built-in presets still generate the same terrain
      - name: Test
        run: ./gradlew :common:test -Prtf.perfMods=false

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test Report
          path: common/build/reports/tests/
